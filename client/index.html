<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAVL Sentinel v0.1</title>
  <!-- Everything must be served from this repo. Do not add CDN links. -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>RAVL Sentinel</h1>
    <p class="subtitle">Transaction Review Tool &middot; v0.1</p>
  </header>

  <main id="app">
    <!-- TODO SE-007: transaction list view -->
    <!-- TODO SE-008: transaction detail panel -->
    <!-- TODO SE-017: audit log panel -->
    <section class="panel audit-panel" id="audit-log-panel">
      <header class="panel-header">
        <h2>Audit Log</h2>
      </header>
      
      <div class="audit-log-content">
        <table class="audit-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Transaction ID</th>
              <th>Reviewer</th>
              <th>Decision</th>
              <th>Reason</th>
            </tr>
          </thead>
          <tbody>
            <!-- dynamic log entries here -->
            <tr>
              <td colspan="5" class="empty-state">No audit logs recorded yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <p class="scaffold-note">
      Nothing is built yet. The API is scaffolded at
      <code>/api/transactions</code> and returns 501 until you implement it.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
