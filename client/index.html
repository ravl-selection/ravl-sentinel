<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAVL Sentinel v0.1</title>
  <!-- Everything must be served from this repo. Do not add CDN links. -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>RAVL Sentinel</h1>
    <p class="subtitle">Transaction Review Tool &middot; v0.1</p>
  </header>

  <main id="app">
    <!-- TODO SE-007: transaction list view -->
    <!-- TODO SE-008: transaction detail panel -->
    <h2>Transaction Details</h2>
    <section id = "detailPanel">
      <p class="empty-state">Select a transaction to view details.</p>
      <p>ID</p>
      <p>Risk</p>
      <p>Sender:</p>
      <p>Receiver:</p>
      <p>Amount:</p>
      <p>Flag:</p>
      <label for = "reviewReason">Justification:</label>
      <input type = "text" id = "reviewReason" placeholder = "Enter justification">
      <label for = "reviewName">Reviewer:</label>
      <input type = "text" id = "reviewerName" placeholder = "Enter Reviewer Name">
      <button id = "approveBttn">Approve</button>
      <button id = "rejectBttn">Reject</button>
      
      </section>
    <!-- TODO SE-017: audit log panel -->
    <p class="scaffold-note">
      Nothing is built yet. The API is scaffolded at
      <code>/api/transactions</code> and returns 501 until you implement it.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
